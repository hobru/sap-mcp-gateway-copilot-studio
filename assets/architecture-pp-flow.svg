<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" font-family="Segoe UI, Arial, sans-serif">
<rect x="0" y="0" width="1200" height="770" fill="#ffffff"/>
<defs><marker id="solid" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker><marker id="open" markerWidth="12" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.2"/></marker></defs>
<text x="600.0" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Part 4 – End-to-end principal propagation: authentication flow</text>
<text x="600.0" y="56" text-anchor="middle" font-size="13" fill="#475569">The signed-in user’s identity travels from Copilot Studio all the way to a real ABAP user on the on-prem SAP system</text>
<line x1="110" y1="132" x2="110" y2="690" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="32" y="72" width="156" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="110" y="93" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Copilot Studio</text>
<text x="110" y="110" text-anchor="middle" font-size="11.5" fill="#1e3a8a">(end user)</text>
<line x1="300" y1="132" x2="300" y2="690" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="222" y="72" width="156" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="300" y="93" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Microsoft</text>
<text x="300" y="110" text-anchor="middle" font-size="11.5" fill="#1e3a8a">Entra ID</text>
<line x1="480" y1="132" x2="480" y2="690" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="402" y="72" width="156" height="50" rx="8" fill="#e6f4f1" stroke="#0a6ed1" stroke-width="1.6"/>
<text x="480" y="93" text-anchor="middle" font-size="13.5" font-weight="700" fill="#08447e">SAP IAS</text>
<text x="480" y="110" text-anchor="middle" font-size="11.5" fill="#08447e">(Identity Auth.)</text>
<line x1="680" y1="132" x2="680" y2="690" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="602" y="72" width="156" height="50" rx="8" fill="#e6f4f1" stroke="#0a6ed1" stroke-width="1.6"/>
<text x="680" y="93" text-anchor="middle" font-size="13.5" font-weight="700" fill="#08447e">MCP Gateway</text>
<text x="680" y="110" text-anchor="middle" font-size="11.5" fill="#08447e">(Integration Cell)</text>
<line x1="900" y1="132" x2="900" y2="690" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="822" y="72" width="156" height="50" rx="8" fill="#e6f4f1" stroke="#0a6ed1" stroke-width="1.6"/>
<text x="900" y="93" text-anchor="middle" font-size="13.5" font-weight="700" fill="#08447e">BTP Destination</text>
<text x="900" y="110" text-anchor="middle" font-size="11.5" fill="#08447e">+ Cloud Connector</text>
<line x1="1090" y1="132" x2="1090" y2="690" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="1012" y="72" width="156" height="50" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="1090" y="93" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7c3d09">On-prem SAP</text>
<text x="1090" y="110" text-anchor="middle" font-size="11.5" fill="#7c3d09">(ICM + ABAP)</text>
<line x1="110" y1="185" x2="300" y2="185" stroke="#334155" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="205.0" y="177" text-anchor="middle" font-size="12" fill="#0f172a">1 · User signs in — OAuth 2.0 authorization code</text>
<line x1="300" y1="235" x2="480" y2="235" stroke="#334155" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="390.0" y="227" text-anchor="middle" font-size="12" fill="#0f172a">2 · Federated login → IAS issues bearer JWT (mail claim)</text>
<line x1="480" y1="285" x2="110" y2="285" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="295.0" y="277" text-anchor="middle" font-size="12" fill="#0f172a">3 · IAS bearer token returned</text>
<line x1="110" y1="335" x2="680" y2="335" stroke="#334155" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="395.0" y="327" text-anchor="middle" font-size="12" fill="#0f172a">4 · Call MCP tool + IAS bearer token</text>
<line x1="680" y1="450" x2="900" y2="450" stroke="#334155" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="790.0" y="427" text-anchor="middle" font-size="12" fill="#0f172a">5 · OData via PrincipalPropagation destination —</text>
<text x="790.0" y="442" text-anchor="middle" font-size="12" fill="#0f172a">forwards mail as SAP-Connectivity-Authentication</text>
<line x1="900" y1="570" x2="1090" y2="570" stroke="#334155" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="995.0" y="562" text-anchor="middle" font-size="12" fill="#0f172a">6 · Mutual TLS to ICM (trusted reverse proxy) + per-user cert</text>
<line x1="1090" y1="662" x2="110" y2="662" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="600.0" y="654" text-anchor="middle" font-size="12" fill="#0f172a">7 · Business Partner data — executed as the real ABAP user</text>
<rect x="608.6" y="360" width="143" height="44" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
<text x="680" y="377" text-anchor="middle" font-size="11" fill="#7c2d12">Validates IAS JWT,</text>
<text x="680" y="392" text-anchor="middle" font-size="11" fill="#7c2d12">reads user&#x27;s mail</text>
<rect x="775.8" y="475" width="248" height="59" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
<text x="900" y="492" text-anchor="middle" font-size="11" fill="#7c2d12">Mints short-lived per-user X.509</text>
<text x="900" y="507" text-anchor="middle" font-size="11" fill="#7c2d12">(subject = mail), signed by PP CA;</text>
<text x="900" y="522" text-anchor="middle" font-size="11" fill="#7c2d12">presents System Certificate</text>
<rect x="1005.4" y="588" width="169" height="44" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
<text x="1090" y="605" text-anchor="middle" font-size="11" fill="#7c2d12">CERTRULE maps email →</text>
<text x="1090" y="620" text-anchor="middle" font-size="11" fill="#7c2d12">ABAP user (rule-based)</text>
<line x1="40" y1="736" x2="72" y2="736" stroke="#334155" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="80" y="740" font-size="12" fill="#334155">request</text>
<line x1="170" y1="736" x2="202" y2="736" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="210" y="740" font-size="12" fill="#334155">token / response</text>
<rect x="360" y="727" width="16" height="16" rx="3" fill="#eff6ff" stroke="#2563eb"/>
<text x="382" y="740" font-size="12" fill="#334155">Microsoft</text>
<rect x="470" y="727" width="16" height="16" rx="3" fill="#e6f4f1" stroke="#0a6ed1"/>
<text x="492" y="740" font-size="12" fill="#334155">SAP BTP</text>
<rect x="575" y="727" width="16" height="16" rx="3" fill="#fef3c7" stroke="#b45309"/>
<text x="597" y="740" font-size="12" fill="#334155">On-prem SAP</text>
<rect x="700" y="727" width="16" height="16" rx="3" fill="#fff7ed" stroke="#fb923c"/>
<text x="722" y="740" font-size="12" fill="#334155">local processing (trust / mapping)</text>
</svg>