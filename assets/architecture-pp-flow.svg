<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Segoe UI, Arial, sans-serif">
<rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>
<defs><marker id="solid" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker><marker id="open" markerWidth="12" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.2"/></marker></defs>
<text x="600.0" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Part 4 – End-to-end principal propagation: authentication flow</text>
<text x="600.0" y="56" text-anchor="middle" font-size="13" fill="#475569">The signed-in user’s identity travels from Copilot Studio all the way to a real ABAP user on the on-prem SAP system</text>
<line x1="110" y1="132" x2="110" y2="726" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="32" y="72" width="156" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="110" y="93" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Copilot Studio</text>
<text x="110" y="110" text-anchor="middle" font-size="11.5" fill="#1e3a8a">(end user)</text>
<line x1="300" y1="132" x2="300" y2="726" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="222" y="72" width="156" height="50" rx="8" fill="#e6f4f1" stroke="#0a6ed1" stroke-width="1.6"/>
<text x="300" y="93" text-anchor="middle" font-size="13.5" font-weight="700" fill="#08447e">SAP IAS</text>
<text x="300" y="110" text-anchor="middle" font-size="11.5" fill="#08447e">(Identity Auth.)</text>
<line x1="490" y1="132" x2="490" y2="726" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="412" y="72" width="156" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="490" y="93" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Microsoft</text>
<text x="490" y="110" text-anchor="middle" font-size="11.5" fill="#1e3a8a">Entra ID</text>
<line x1="690" y1="132" x2="690" y2="726" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="612" y="72" width="156" height="50" rx="8" fill="#e6f4f1" stroke="#0a6ed1" stroke-width="1.6"/>
<text x="690" y="93" text-anchor="middle" font-size="13.5" font-weight="700" fill="#08447e">MCP Gateway</text>
<text x="690" y="110" text-anchor="middle" font-size="11.5" fill="#08447e">(Integration Cell)</text>
<line x1="900" y1="132" x2="900" y2="726" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="822" y="72" width="156" height="50" rx="8" fill="#e6f4f1" stroke="#0a6ed1" stroke-width="1.6"/>
<text x="900" y="93" text-anchor="middle" font-size="13.5" font-weight="700" fill="#08447e">BTP Destination</text>
<text x="900" y="110" text-anchor="middle" font-size="11.5" fill="#08447e">+ Cloud Connector</text>
<line x1="1090" y1="132" x2="1090" y2="726" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="1012" y="72" width="156" height="50" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
<text x="1090" y="93" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7c3d09">On-prem SAP</text>
<text x="1090" y="110" text-anchor="middle" font-size="11.5" fill="#7c3d09">(ICM + ABAP)</text>
<line x1="110" y1="180" x2="300" y2="180" stroke="#334155" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="205.0" y="172" text-anchor="middle" font-size="12" fill="#0f172a">1 · User signs in — OAuth 2.0 authorize request to IAS</text>
<line x1="300" y1="225" x2="490" y2="225" stroke="#334155" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="395.0" y="217" text-anchor="middle" font-size="12" fill="#0f172a">2 · IAS brokers to the federated corporate IdP (Entra ID)</text>
<line x1="490" y1="270" x2="300" y2="270" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="395.0" y="262" text-anchor="middle" font-size="12" fill="#0f172a">3 · User authenticated — assertion returned to IAS</text>
<line x1="300" y1="315" x2="110" y2="315" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="205.0" y="307" text-anchor="middle" font-size="12" fill="#0f172a">4 · IAS issues bearer JWT (mail claim)</text>
<line x1="110" y1="370" x2="690" y2="370" stroke="#334155" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="400.0" y="362" text-anchor="middle" font-size="12" fill="#0f172a">5 · Call MCP tool + IAS bearer token</text>
<line x1="690" y1="485" x2="900" y2="485" stroke="#334155" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="795.0" y="462" text-anchor="middle" font-size="12" fill="#0f172a">6 · OData via PrincipalPropagation destination —</text>
<text x="795.0" y="477" text-anchor="middle" font-size="12" fill="#0f172a">forwards mail as SAP-Connectivity-Authentication</text>
<line x1="900" y1="605" x2="1090" y2="605" stroke="#334155" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="995.0" y="597" text-anchor="middle" font-size="12" fill="#0f172a">7 · Mutual TLS to ICM (trusted reverse proxy) + per-user cert</text>
<line x1="1090" y1="700" x2="110" y2="700" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="600.0" y="692" text-anchor="middle" font-size="12" fill="#0f172a">8 · Business Partner data — executed as the real ABAP user</text>
<rect x="618.6" y="395" width="143" height="44" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
<text x="690" y="412" text-anchor="middle" font-size="11" fill="#7c2d12">Validates IAS JWT,</text>
<text x="690" y="427" text-anchor="middle" font-size="11" fill="#7c2d12">reads user&#x27;s mail</text>
<rect x="775.8" y="510" width="248" height="59" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
<text x="900" y="527" text-anchor="middle" font-size="11" fill="#7c2d12">Mints short-lived per-user X.509</text>
<text x="900" y="542" text-anchor="middle" font-size="11" fill="#7c2d12">(subject = mail), signed by PP CA;</text>
<text x="900" y="557" text-anchor="middle" font-size="11" fill="#7c2d12">presents System Certificate</text>
<rect x="1005.4" y="623" width="169" height="44" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
<text x="1090" y="640" text-anchor="middle" font-size="11" fill="#7c2d12">CERTRULE maps email →</text>
<text x="1090" y="655" text-anchor="middle" font-size="11" fill="#7c2d12">ABAP user (rule-based)</text>
<line x1="40" y1="766" x2="72" y2="766" stroke="#334155" stroke-width="1.8" marker-end="url(#solid)"/>
<text x="80" y="770" font-size="12" fill="#334155">request</text>
<line x1="170" y1="766" x2="202" y2="766" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="210" y="770" font-size="12" fill="#334155">token / response</text>
<rect x="360" y="757" width="16" height="16" rx="3" fill="#eff6ff" stroke="#2563eb"/>
<text x="382" y="770" font-size="12" fill="#334155">Microsoft</text>
<rect x="470" y="757" width="16" height="16" rx="3" fill="#e6f4f1" stroke="#0a6ed1"/>
<text x="492" y="770" font-size="12" fill="#334155">SAP BTP</text>
<rect x="575" y="757" width="16" height="16" rx="3" fill="#fef3c7" stroke="#b45309"/>
<text x="597" y="770" font-size="12" fill="#334155">On-prem SAP</text>
<rect x="700" y="757" width="16" height="16" rx="3" fill="#fff7ed" stroke="#fb923c"/>
<text x="722" y="770" font-size="12" fill="#334155">local processing (trust / mapping)</text>
</svg>